<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel Payment App Preview</title>
    <style>
        /* Center the mobile frame perfectly on the browser screen */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f5f7; /* Soft gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Container that mimics a smartphone outline */
        .phone-wrapper {
            width: 375px; 
            height: 812px;
            background: #ffffff;
            border-radius: 40px; /* Gives the screen rounded phone corners */
            box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.12); /* Clean app drop shadow */
            border: 12px solid #1a1a1a; /* Creates the outer phone bezel */
            overflow: hidden;
            position: relative;
        }

        /* Force figma frame to fit exactly inside our container dimensions */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- This wrapper creates a neat mobile phone view on the desktop site -->
    <div class="phone-wrapper">
         <iframe style="border: 1px solid rgba(0, 0, 0, 0.1);" width="800" height="450" src="https://embed.figma.com/design/cyujIbPKemLEw80J6emB1A/Angel-Payment-App-UX-UI-design?node-id=0-1&embed-host=share" allowfullscreen></iframe>
    </div>

</body>
</html>
